<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Studio</title>
  <meta name="description" content="AI image and cinematic camera-motion video studio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0b0f'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.5' fill='none' stroke='%23c8ff4d' stroke-width='2' transform='rotate(-25 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c8ff4d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Orbit Studio</span>
      </a>
      <nav class="nav">
        <button class="nav-item is-active" data-view="image" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
          Image
        </button>
        <button class="nav-item" data-view="video" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
          Video
        </button>
        <button class="nav-item" data-view="library" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Library
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="mode-pill" id="modePill">…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="view-title" id="viewTitle">Image</h1>
        <div class="topbar-right">
          <span class="queue-chip" id="queueChip" hidden></span>
        </div>
      </header>

      <!-- IMAGE VIEW -->
      <section class="view is-active" data-view="image">
        <div class="composer">
          <label class="sr-only" for="imagePrompt">Prompt</label>
          <textarea id="imagePrompt" class="prompt" rows="3" placeholder="Describe the shot. A lone astronaut on a neon rooftop at dusk, rain, cinematic…"></textarea>
          <div class="composer-row">
            <div class="chip-group" id="aspectChips" role="radiogroup" aria-label="Aspect ratio"></div>
            <div class="composer-actions">
              <label class="select-wrap">
                <span>Style</span>
                <select id="styleSelect"></select>
              </label>
              <label class="select-wrap">
                <span>Count</span>
                <select id="countSelect">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="4">4</option>
                </select>
              </label>
              <button class="btn btn-primary" id="generateImageBtn" type="button">Generate</button>
            </div>
          </div>
          <div class="suggestions" id="imageSuggestions"></div>
        </div>
        <h2 class="section-title">Recent images</h2>
        <div class="grid" id="imageFeed"></div>
        <p class="empty" id="imageEmpty">Nothing yet. Write a prompt above and hit Generate.</p>
      </section>

      <!-- VIDEO VIEW -->
      <section class="view" data-view="video">
        <div class="video-layout">
          <div class="video-left">
            <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a reference image">
              <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
              <div class="dropzone-empty" id="dropEmpty">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
                <strong>Drop a reference image</strong>
                <span>or click to browse, or pick one from your library</span>
              </div>
              <div class="dropzone-preview" id="dropPreview" hidden>
                <img id="refImage" alt="Reference image">
                <button class="btn btn-ghost btn-small dropzone-clear" id="clearRef" type="button">Change</button>
              </div>
            </div>
            <label class="sr-only" for="videoPrompt">Motion prompt</label>
            <textarea id="videoPrompt" class="prompt" rows="2" placeholder="Optional: describe what happens in the shot (she turns and smiles, sparks fly…)"></textarea>
            <div class="composer-row">
              <div class="chip-group" id="durationChips" role="radiogroup" aria-label="Duration"></div>
              <div class="composer-actions">
                <label class="select-wrap">
                  <span>Model</span>
                  <select id="modelSelect"></select>
                </label>
                <button class="btn btn-primary" id="generateVideoBtn" type="button" disabled>Animate</button>
              </div>
            </div>
          </div>
          <div class="video-right">
            <div class="motion-header">
              <h2 class="section-title">Camera motion</h2>
              <div class="chip-group chip-group-small" id="motionGroups"></div>
            </div>
            <div class="motion-grid" id="motionGrid"></div>
          </div>
        </div>
        <h2 class="section-title">Recent videos</h2>
        <div class="grid" id="videoFeed"></div>
        <p class="empty" id="videoEmpty">No videos yet. Upload an image, pick a motion, and animate it.</p>
      </section>

      <!-- LIBRARY VIEW -->
      <section class="view" data-view="library">
        <div class="library-toolbar">
          <div class="chip-group" id="libraryFilters" role="radiogroup" aria-label="Filter">
            <button class="chip is-active" data-filter="all" type="button">All</button>
            <button class="chip" data-filter="image" type="button">Images</button>
            <button class="chip" data-filter="video" type="button">Videos</button>
          </div>
          <span class="muted" id="libraryCount"></span>
        </div>
        <div class="grid" id="libraryFeed"></div>
        <p class="empty" id="libraryEmpty">Your generations will show up here.</p>
      </section>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">×</button>
    <div class="lightbox-body" id="lightboxBody"></div>
    <div class="lightbox-meta" id="lightboxMeta"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-media"></div>
      <div class="card-overlay">
        <div class="card-status"></div>
        <div class="card-actions"></div>
      </div>
      <div class="card-caption"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
